<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学笔记</title>
    <!-- MathJax for LaTeX rendering -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <!-- marked for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // Configure MathJax to process formulas on page load
        window.MathJax = {
            startup: {
                typeset: true
            },
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        /* Symbol toolbar - full width at top */
        .symbol-toolbar-container {
            width: 100%;
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }

        .symbol-toolbar {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
        }

        /* Panels header - fixed headers above scroll area */
        .panels-header {
            display: flex;
            padding: 20px 20px 10px 20px;
            gap: 20px;
        }

        .editor-header-panel {
            flex: 1;
            min-width: 0;
        }

        .preview-header-panel {
            flex: 1;
            min-width: 0;
            padding-left: 20px;
        }

        /* Shared scroll container */
        .shared-scroll-container {
            overflow-y: scroll;
            overflow-x: hidden;
            height: 820px;
            margin: 0 20px 20px 20px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
        }

        .panels-wrapper {
            display: flex;
            min-height: 100%;
        }

        .editor-panel {
            flex: 1;
            min-width: 0;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .preview-panel {
            flex: 1;
            min-width: 0;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .panel-divider {
            width: 3px;
            background: #667eea;
            flex-shrink: 0;
        }

        .section-title {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        /* Symbol buttons */
        .symbol-group {
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .symbol-group:last-child {
            margin-bottom: 0;
        }

        .symbol-group-title {
            font-size: 0.85em;
            color: #666;
            font-weight: 600;
            white-space: nowrap;
        }

        .symbol-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }

        .symbol-btn {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 3px;
            padding: 3px 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            min-width: 24px;
            text-align: center;
        }

        .symbol-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: translateY(-2px);
        }

        /* Editor with line numbers */
        .editor-container {
            position: relative;
            background: white;
            display: flex;
            border-radius: 8px;
        }

        .line-numbers {
            position: sticky;
            left: 0;
            z-index: 1;
            align-self: flex-start;
            background: #f5f5f5;
            color: #888;
            padding: 2px 5px;
            text-align: right;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.6em;
            user-select: none;
            min-width: 40px;
            border-right: 1px solid #dee2e6;
            white-space: pre;
            overflow: hidden;
            flex-shrink: 0;
        }

        #mathEditor {
            flex: 1;
            padding: 2px;
            border: none;
            outline: none;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.5em;
            resize: none;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: pre;
        }

        #mathEditor:focus {
            background: #fafafa;
        }

        /* Preview area */
        .preview-container {
            border-radius: 8px;
            padding: 15px;
            background: #fafafa;
        }

        #previewContent {
            font-size: 16px;
            line-height: 1.6;
            color: #333;
            word-wrap: break-word;
        }

        #previewContent h1,
        #previewContent h2,
        #previewContent h3,
        #previewContent h4,
        #previewContent h5,
        #previewContent h6 {
            margin: 0.8em 0 0.4em;
            font-weight: 600;
            line-height: 1.3;
        }

        #previewContent h1 { font-size: 1.8em; border-bottom: 2px solid #eee; padding-bottom: 0.2em; }
        #previewContent h2 { font-size: 1.5em; border-bottom: 1px solid #eee; padding-bottom: 0.2em; }
        #previewContent h3 { font-size: 1.25em; }
        #previewContent h4 { font-size: 1.1em; }

        #previewContent p {
            margin: 0.6em 0;
        }

        #previewContent ul,
        #previewContent ol {
            margin: 0.6em 0;
            padding-left: 1.8em;
        }

        #previewContent li {
            margin: 0.2em 0;
        }

        #previewContent blockquote {
            margin: 0.8em 0;
            padding: 0.4em 1em;
            border-left: 4px solid #667eea;
            background: #f4f5fb;
            color: #555;
        }

        #previewContent code {
            background: #f0f0f0;
            padding: 0.15em 0.4em;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        #previewContent pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 12px 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 0.8em 0;
        }

        #previewContent pre code {
            background: none;
            padding: 0;
            color: inherit;
        }

        #previewContent table {
            border-collapse: collapse;
            margin: 0.8em 0;
            width: auto;
        }

        #previewContent th,
        #previewContent td {
            border: 1px solid #dee2e6;
            padding: 6px 12px;
            text-align: left;
        }

        #previewContent th {
            background: #f8f9fa;
            font-weight: 600;
        }

        #previewContent a {
            color: #667eea;
            text-decoration: none;
        }

        #previewContent a:hover {
            text-decoration: underline;
        }

        #previewContent hr {
            border: none;
            border-top: 1px solid #dee2e6;
            margin: 1em 0;
        }

        #previewContent img {
            max-width: 100%;
        }

        /* Action buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-top: 1px solid #dee2e6;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-image {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-image:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .btn-refresh {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        /* Filename input */
        .filename-input-container {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filename-input-container label {
            font-weight: 600;
            color: #333;
            font-size: 14px;
            white-space: nowrap;
        }

        .filename-input-container input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .filename-input-container input:focus {
            border-color: #667eea;
        }

        .editor-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .editor-title {
            font-size: 1.2em;
            color: #333;
            font-weight: 600;
            white-space: nowrap;
        }

        /* File Manager */
        .file-manager {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-top: 1px solid #dee2e6;
        }

        .file-manager-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .file-list {
            max-height: 300px;
            overflow-y: auto;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 10px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-item:hover {
            background: #f8f9fa;
        }

        .file-name {
            font-size: 14px;
            color: #333;
            cursor: pointer;
            text-decoration: none;
        }

        .file-name:hover {
            color: #667eea;
            text-decoration: underline;
        }

        .file-actions {
            display: flex;
            gap: 5px;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
        }

        .btn-delete {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-load {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .loading-text {
            color: #666;
            text-align: center;
            padding: 20px;
        }

        /* Status message */
        .status-message {
            padding: 10px 20px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .panels-header {
                flex-direction: column;
            }

            .preview-header-panel {
                padding-left: 0;
            }

            .panels-wrapper {
                flex-direction: column;
            }

            .panel-divider {
                width: 100%;
                height: 3px;
            }
        }

        /* Hidden file input */
        #imageInput {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 数学笔记</h1>
            <p>支持 LaTeX 公式编辑与实时预览</p>
        </div>

        <div class="symbol-toolbar-container">
            <!-- Symbol toolbar -->
            <div class="symbol-toolbar">
                    <div class="symbol-group">
                        <div class="symbol-group-title">几何符号</div>
                        <div class="symbol-buttons">
                            <button class="symbol-btn" onclick="insertSymbol('\\angle')" title="角">⦟</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\triangle')" title="三角形">⨺</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\square')" title="正方形">⬜</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\bigcirc')" title="圆">⬤</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\perp')" title="垂直">⟂</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\parallel')" title="平行">⫽</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\cong')" title="全等">≌</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\sim')" title="相似">∽</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\therefore')" title="所以">∴</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\because')" title="因为">∵</button>
                        </div>
                    </div>

                    <div class="symbol-group">
                        <div class="symbol-group-title">希腊字母（小写）</div>
                        <div class="symbol-buttons">
                            <button class="symbol-btn" onclick="insertSymbol('\\alpha')">α</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\beta')">β</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\gamma')">γ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\delta')">δ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\epsilon')">ε</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\zeta')">ζ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\eta')">η</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\theta')">θ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\iota')">ι</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\kappa')">κ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\lambda')">λ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\mu')">μ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\nu')">ν</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\xi')">ξ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\pi')">π</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\rho')">ρ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\sigma')">σ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\tau')">τ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\upsilon')">υ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\phi')">φ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\chi')">χ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\psi')">ψ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\omega')">ω</button>
                        </div>
                    </div>

                    <div class="symbol-group">
                        <div class="symbol-group-title">希腊字母（大写）</div>
                        <div class="symbol-buttons">
                            <button class="symbol-btn" onclick="insertSymbol('\\Gamma')">Γ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\Delta')">Δ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\Theta')">Θ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\Lambda')">Λ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\Xi')">Ξ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\Pi')">Π</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\Sigma')">Σ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\Upsilon')">Υ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\Phi')">Φ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\Psi')">Ψ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\Omega')">Ω</button>
                        </div>
                    </div>

                    <div class="symbol-group">
                        <div class="symbol-group-title">常用运算</div>
                        <div class="symbol-buttons">
                            <button class="symbol-btn" onclick="insertSymbol('\\frac{}{}')">⨋</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\sqrt{}')">√</button>
                            <button class="symbol-btn" onclick="insertSymbol('^{}')">ˣ</button>
                            <button class="symbol-btn" onclick="insertSymbol('_{}')">ₓ</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\sum')">∑</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\int')">∫</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\prod')">∏</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\lim')">lim</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\infty')">∞</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\pm')">±</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\times')">×</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\div')">÷</button>
                        </div>
                    </div>

                    <div class="symbol-group">
                        <div class="symbol-group-title">括号与集合</div>
                        <div class="symbol-buttons">
                            <button class="symbol-btn" onclick="insertSymbol('\\left( \\right)')">( )</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\left[ \\right]')">[ ]</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\left\\{ \\right\\}')">{ }</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\in')">∈</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\notin')">∉</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\subset')">⊂</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\supset')">⊃</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\cup')">∪</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\cap')">∩</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\emptyset')">∅</button>
                        </div>
                    </div>

                    <div class="symbol-group">
                        <div class="symbol-group-title">关系符号</div>
                        <div class="symbol-buttons">
                            <button class="symbol-btn" onclick="insertSymbol('=')">＝</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\neq')">≠</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\approx')">≈</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\leq')">≤</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\geq')">≥</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\lt')"><</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\gt')">&gt;</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\equiv')">≡</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\propto')">∝</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\leftarrow')">←</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\rightarrow')">→</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\leftrightarrow')">↔</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\longleftarrow')">←</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\longrightarrow')">→</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\longleftrightarrow')">↔</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\mapsto')">↦</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\hookleftarrow')">↩</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\hookrightarrow')">↪</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\longmapsto')">↦</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\forall')">∀</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\exists')">∃</button>
                        </div>
                    </div>

                    <div class="symbol-group">
                        <div class="symbol-group-title">带圈数字</div>
                        <div class="symbol-buttons">
                            <button class="symbol-btn" onclick="insertSymbol('\\textcircled{1}')">①</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\textcircled{2}')">②</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\textcircled{3}')">③</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\textcircled{4}')">④</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\textcircled{5}')">⑤</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\textcircled{6}')">⑥</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\textcircled{7}')">⑦</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\textcircled{8}')">⑧</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\textcircled{9}')">⑨</button>
                            <button class="symbol-btn" onclick="insertSymbol('\\textcircled{10}')">⑩</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Headers above scroll area -->
        <div class="panels-header">
            <div class="editor-header-panel">
                <div class="editor-header">
                    <div class="editor-title">编辑器</div>
                    <div class="filename-input-container" style="margin-bottom: 0; flex: 1;">
                        <label for="filenameInput">文件名:</label>
                        <input type="text" id="filenameInput" placeholder="输入文件名（例如：math_note_2025）" value="">
                    </div>
                </div>
            </div>
            <div class="preview-header-panel">
                <div class="section-title">实时预览</div>
            </div>
        </div>

        <!-- Shared scroll container with both panels -->
        <div class="shared-scroll-container" id="sharedScrollContainer">
            <div class="panels-wrapper">
                <div class="editor-panel">
                    <div class="editor-container">
                        <div class="line-numbers" id="lineNumbers">1</div>
                        <textarea id="mathEditor" placeholder="在此输入数学笔记，支持 LaTeX 公式...&#10;&#10;例如：&#10;$E = mc^2$&#10;$\int_{0}^{\infty} e^{-x^2} dx$&#10;$\sum_{n=1}^{\infty} \frac{1}{n^2} = \frac{\pi^2}{6}$"></textarea>
                    </div>
                </div>
                <div class="panel-divider"></div>
                <div class="preview-panel">
                    <div class="preview-container">
                        <div id="previewContent"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="saveStatus" class="status-message"></div>

        <div class="action-buttons">
            <button class="btn btn-save" onclick="saveNote()">
                💾 保存笔记
            </button>
            <button class="btn btn-image" onclick="document.getElementById('imageInput').click()">
                📷 图片识别导入
            </button>
            <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)">
            <!-- Hidden file input for directory selection -->
            <input type="file" id="directoryInput" webkitdirectory mozdirectory msdirectory odirectory directory style="display: none;">
        </div>

        <!-- File Manager Section -->
        <div class="file-manager">
            <div class="file-manager-header">
                <div class="section-title">📁 文件管理器</div>
                <button class="btn btn-refresh" onclick="loadFileList()">
                    🔄 刷新
                </button>
            </div>
            <div class="file-list" id="fileList">
                <p class="loading-text">加载中...</p>
            </div>
        </div>
    </div>

    <script>
        const editor = document.getElementById('mathEditor');
        const previewContent = document.getElementById('previewContent');
        const lineNumbers = document.getElementById('lineNumbers');
        const saveStatus = document.getElementById('saveStatus');
        const sharedScrollContainer = document.getElementById('sharedScrollContainer');
        const editorPanel = document.querySelector('.editor-panel');
        
        // Base directory for relative image paths (set when loading a file)
        let imageBaseDir = '';

        // Update line numbers
        function updateLineNumbers() {
            const lines = editor.value.split('\n');
            const lineCount = Math.max(lines.length, 42);
            let lineNumHTML = '';
            for (let i = 1; i <= lineCount; i++) {
                if (i > 1) {
                    lineNumHTML += '\n';
                }
                lineNumHTML += i;
            }
            lineNumbers.textContent = lineNumHTML;
        }

        // Insert symbol at cursor position
        function insertSymbol(symbol) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const text = editor.value;
            
            editor.value = text.substring(0, start) + symbol + text.substring(end);
            editor.focus();
            editor.selectionStart = editor.selectionEnd = start + symbol.length;
            
            updatePreview();
            updateLineNumbers();
            syncHeights();
        }

        // Update preview with Markdown + MathJax rendering
        function updatePreview() {
            let content = editor.value;

            const mathStore = [];
            const imgStore = [];

            // 1. Protect LaTeX math so Markdown does not mangle it
            //    Order matters: display math before inline math
            content = content.replace(/\$\$([\s\S]+?)\$\$/g, function(m) {
                mathStore.push(m);
                return '%%%MATH' + (mathStore.length - 1) + '%%%';
            });
            content = content.replace(/\\\[([\s\S]+?)\\\]/g, function(m) {
                mathStore.push(m);
                return '%%%MATH' + (mathStore.length - 1) + '%%%';
            });
            content = content.replace(/\$([^\$\n]+?)\$/g, function(m) {
                mathStore.push(m);
                return '%%%MATH' + (mathStore.length - 1) + '%%%';
            });
            content = content.replace(/\\\(([\s\S]+?)\\\)/g, function(m) {
                mathStore.push(m);
                return '%%%MATH' + (mathStore.length - 1) + '%%%';
            });

            // 2. Protect custom image syntax: ![alt](path){width=X% style="..."}
            content = content.replace(/!\[([^\]]*)\]\(([^)]+)\)(?:\{([^}]*)\})?/g, function(match, alt, src, attrs) {
                let imgSrc = src;
                // If the source is a relative path (not http(s) or absolute), prepend the base directory
                if (imageBaseDir && !src.match(/^https?:\/\//) && !src.startsWith('/')) {
                    imgSrc = imageBaseDir + '/' + src;
                } else if (!src.match(/^https?:\/\//) && src.startsWith('imgs/')) {
                    imgSrc = '/uploads/' + src;
                }

                let imgHtml = '<img src="' + imgSrc + '" alt="' + alt + '"';
                if (attrs) {
                    const widthMatch = attrs.match(/width=(\d+%)/);
                    const styleMatch = attrs.match(/style="([^"]*)"/);
                    if (widthMatch) {
                        imgHtml += ' style="width: ' + widthMatch[1] + ';';
                        if (styleMatch) {
                            imgHtml += ' ' + styleMatch[1];
                        }
                        imgHtml += '"';
                    } else if (styleMatch) {
                        imgHtml += ' style="' + styleMatch[1] + '"';
                    }
                }
                imgHtml += '>';
                imgStore.push(imgHtml);
                return '%%%IMG' + (imgStore.length - 1) + '%%%';
            });

            // 3. Render Markdown
            if (window.marked) {
                content = marked.parse(content, { gfm: true, breaks: true });
            } else {
                content = content.replace(/\n/g, '<br>');
            }

            // 4. Restore protected images and math
            content = content.replace(/%%%IMG(\d+)%%%/g, function(m, i) {
                return imgStore[Number(i)];
            });
            content = content.replace(/%%%MATH(\d+)%%%/g, function(m, i) {
                return mathStore[Number(i)];
            });

            previewContent.innerHTML = content;

            // Render MathJax (retries until the async library is ready)
            typesetMath();

            updateLineNumbers();
        }

        // Typeset math, waiting for the async MathJax library if needed
        function typesetMath() {
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([previewContent]).catch((err) => console.log(err));
            } else {
                setTimeout(typesetMath, 200);
            }
        }

        // Save note
        async function saveNote() {
            const content = editor.value;
            
            // Get filename from input field
            const filenameInput = document.getElementById('filenameInput');
            let filename = filenameInput.value.trim();
            
            if (!filename || filename === '') {
                showStatus('❌ 请输入文件名', 'error');
                filenameInput.focus();
                return;
            }
            
            try {
                const response = await fetch('/save', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        content: content,
                        filename: filename
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showStatus(`✅ ${result.message} 文件名：${result.filename}`, 'success');
                    // Refresh file list after saving
                    loadFileList();
                } else {
                    showStatus(`❌ ${result.message}`, 'error');
                }
            } catch (error) {
                showStatus(`❌ 保存失败：${error.message}`, 'error');
            }
        }

        // Load file list
        async function loadFileList() {
            const fileListDiv = document.getElementById('fileList');
            fileListDiv.innerHTML = '<p class="loading-text">加载中...</p>';
            
            try {
                const response = await fetch('/files');
                const result = await response.json();
                
                if (result.success && result.files.length > 0) {
                    let html = '';
                    result.files.forEach(file => {
                        html += `
                            <div class="file-item">
                                <a href="#" class="file-name" onclick="loadFile('${file.filename}'); return false;">📄 ${file.filename}</a>
                                <div class="file-actions">
                                    <button class="btn btn-sm btn-load" onclick="loadFile('${file.filename}')">加载</button>
                                    <button class="btn btn-sm btn-delete" onclick="deleteFile('${file.filename}')">删除</button>
                                </div>
                            </div>
                        `;
                    });
                    fileListDiv.innerHTML = html;
                } else {
                    fileListDiv.innerHTML = '<p class="loading-text">暂无文件</p>';
                }
            } catch (error) {
                fileListDiv.innerHTML = `<p class="loading-text">加载失败：${error.message}</p>`;
            }
        }

        // Load file content into editor
        async function loadFile(filename) {
            try {
                const response = await fetch(`/load_file?filename=${encodeURIComponent(filename)}`);
                const result = await response.json();
                
                if (result.success) {
                    editor.value = result.content;
                    // Set filename in input field (without extension)
                    const filenameInput = document.getElementById('filenameInput');
                    filenameInput.value = filename.replace('.md', '');
                    
                    // Set image base directory for relative paths (imgs/ folder relative to the loaded file)
                    if (result.file_dir) {
                        imageBaseDir = result.file_dir;
                    } else {
                        imageBaseDir = '';
                    }
                    
                    updatePreview();
                    syncHeights();
                    showStatus(`✅ 文件 "${filename}" 已加载`, 'success');
                } else {
                    showStatus(`❌ ${result.message}`, 'error');
                }
            } catch (error) {
                showStatus(`❌ 加载失败：${error.message}`, 'error');
            }
        }

        // Delete file
        async function deleteFile(filename) {
            if (!confirm(`确定要删除文件 "${filename}" 吗？此操作不可恢复。`)) {
                return;
            }
            
            try {
                const response = await fetch('/delete_file', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ filename: filename })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showStatus(`✅ ${result.message}`, 'success');
                    loadFileList();
                } else {
                    showStatus(`❌ ${result.message}`, 'error');
                }
            } catch (error) {
                showStatus(`❌ 删除失败：${error.message}`, 'error');
            }
        }

        // Handle image upload
        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const formData = new FormData();
            formData.append('image', file);
            
            try {
                const response = await fetch('/upload_image', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Insert recognized text into editor
                    const start = editor.selectionStart;
                    const text = editor.value;
                    editor.value = text.substring(0, start) + result.recognized_text + text.substring(editor.selectionEnd);
                    editor.focus();
                    
                    showStatus(`✅ ${result.message}`, 'success');
                    updatePreview();
                    syncHeights();
                } else {
                    showStatus(`❌ ${result.message}`, 'error');
                }
            } catch (error) {
                showStatus(`❌ 图片处理失败：${error.message}`, 'error');
            }
            
            // Reset file input
            event.target.value = '';
        }

        // Show status message
        function showStatus(message, type) {
            saveStatus.textContent = message;
            saveStatus.className = `status-message status-${type}`;
            saveStatus.style.display = 'block';
            
            setTimeout(() => {
                saveStatus.style.display = 'none';
            }, 5000);
        }

        // Sync heights so the shared scroll container has enough range
        function syncHeights() {
            const editorHeight = editor.scrollHeight;
            const previewHeight = document.querySelector('.preview-container').scrollHeight;
            const maxH = Math.max(editorHeight, previewHeight, 820);
            document.querySelector('.panels-wrapper').style.minHeight = maxH + 'px';
            lineNumbers.style.height = editorHeight + 'px';
        }

        // Shared vertical scroll: sync both panels and line numbers
        sharedScrollContainer.addEventListener('scroll', () => {
            const scrollTop = sharedScrollContainer.scrollTop;
            editorPanel.scrollTop = scrollTop;
            document.querySelector('.preview-panel').scrollTop = scrollTop;
            lineNumbers.style.transform = 'translateY(' + scrollTop + 'px)';
        });

        // Editor horizontal scroll: sync line-numbers horizontally
        editorPanel.addEventListener('scroll', () => {
            lineNumbers.scrollLeft = editorPanel.scrollLeft;
        });

        // Event listeners
        editor.addEventListener('input', () => {
            updatePreview();
            syncHeights();
        });

        // Initialize
        updateLineNumbers();
        updatePreview();
        syncHeights();
        loadFileList();
    </script>
</body>
</html>
